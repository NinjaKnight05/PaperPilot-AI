name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
  pull_request:
    branches: [main]
    paths:
      - 'back/**'

jobs:
  docker-build:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (validates Dockerfile + requirements.txt install cleanly)
        working-directory: back
        run: docker build -t paperpilot-backend-ci .

            - name: Quick smoke test — container starts and responds on /
        working-directory: back
        run: |
          docker run -d --name smoke-test -p 8000:8000 \
            -e PINECONE_API_KEY=dummy \
            -e NVIDIA_API_KEY=dummy \
            -e TAVILY_API_KEY=dummy \
            paperpilot-backend-ci
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://localhost:8000/ || (docker logs smoke-test && exit 1)
          docker stop smoke-test

  python-syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile-check all backend Python files
        working-directory: back
        run: python -m py_compile app/**/*.py app/*.py